{{- if and (or .Values.headlessService.enabled (eq .Values.workload.type "statefulset")) (ne .Values.workload.type "none") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "universal.fullname" . }}-headless
  namespace: {{ include "universal.namespace" . }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
  {{- with include "universal.annotations" (dict "root" $ "extra" .Values.headlessService.annotations) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  clusterIP: None
  selector:
    {{- include "universal.selectorLabels" (dict "root" $ "component" "workload") | nindent 4 }}
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}
{{- end }}
