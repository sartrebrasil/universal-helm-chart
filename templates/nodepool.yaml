{{- /* NodePool (Karpenter v1beta1, a versão usada nos clusters oobj). Cluster-scoped: sem namespace. Os pods são amarrados a ele via nodeSelector. */ -}}
{{- if .Values.karpenter.enabled }}
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: {{ include "universal.nodepoolName" . }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
  {{- with include "universal.annotations" (dict "root" $ "extra" nil) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  {{- with .Values.karpenter.disruption }}
  disruption:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.karpenter.limits }}
  limits:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- with .Values.karpenter.metadata }}
    metadata:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    spec:
      nodeClassRef:
        name: {{ .Values.karpenter.nodeClassRef }}
      {{- with .Values.karpenter.requirements }}
      requirements:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.karpenter.taints }}
      taints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
