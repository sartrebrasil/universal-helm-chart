{{- if .Values.job.enabled }}
{{- /* spec.template de Job é imutável: sem hook, um upgrade que muda a imagem falha se o Job antigo ainda existir (ttl). Com job.hook.enabled o Job é recriado a cada release. */}}
{{- $extra := .Values.job.annotations | default dict }}
{{- if .Values.job.hook.enabled }}
{{- $extra = merge (dict "helm.sh/hook" .Values.job.hook.events "helm.sh/hook-weight" (.Values.job.hook.weight | toString) "helm.sh/hook-delete-policy" .Values.job.hook.deletePolicy) $extra }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "universal.fullname" . }}-job
  namespace: {{ include "universal.namespace" . }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
    {{- with .Values.job.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with include "universal.annotations" (dict "root" $ "extra" $extra) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  completions: {{ .Values.job.completions }}
  parallelism: {{ .Values.job.parallelism }}
  {{- with .Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "universal.selectorLabels" (dict "root" $ "component" "job") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with include "universal.podAnnotations" (dict "root" $ "checksums" false) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.job.restartPolicy }}
      {{- include "universal.podSpec" (dict "root" $ "component" "job" "o" .Values.job) | nindent 6 }}
{{- end }}
