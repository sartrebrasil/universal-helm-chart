image:
  repository: ghcr.io/acme/{{ .Release.Name }}
  tag: "1.0.0"
configFiles:
  enabled: true
  path: /app/{{ .Release.Name }}/config
  data:
    application.yaml: |
      server:
        port: 8080
  secretData:
    db.properties: |
      password=change-me
lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 10"]
serviceMonitor:
  enabled: true
  honorLabels: true
  namespace: monitoring
ingress:
  - name: public
    className: nginx
    tls:
      - secretName: app-tls
        hosts: [app.example.com]
    hosts:
      - host: app.example.com
        paths:
          - path: /
  - className: nginx-internal
    hosts:
      - host: app.internal
        paths:
          - path: /admin
            servicePort: 8080
