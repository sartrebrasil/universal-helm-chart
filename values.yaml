# Universal Workload Helm Chart
# Use este chart para APIs, workers, apps web, jobs one-shot e cronjobs.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

commonLabels: {}
commonAnnotations: {}

replicaCount: 2

image:
  # aceita templates, ex.: 123.dkr.ecr.us-east-1.amazonaws.com/{{ .Release.Name }}
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

imagePullSecrets: []

workload:
  # deployment | statefulset | daemonset | none
  type: deployment
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

command: []
args: []

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP

env: []
# - name: JAVA_OPTS
#   value: "-XX:MaxRAMPercentage=75"

# fontes extras; o configMap e o secret deste release (abaixo), quando enabled, entram sozinhos depois destas
envFrom: []
# - configMapRef:
#     name: my-config

configMap:
  enabled: false
  name: ""
  annotations: {}
  data: {}
  binaryData: {}

# arquivos de config montados no container (um subPath por chave), em configFiles.path (aceita tpl).
# data -> ConfigMap, secretData -> Secret. Alterar o conteúdo reinicia os pods (checksum).
configFiles:
  enabled: false
  path: /etc/app/config
  data: {}
  # application.yaml: |
  #   server.port: 8080
  secretData: {}

secret:
  enabled: false
  name: ""
  annotations: {}
  type: Opaque
  stringData: {}
  data: {}

externalSecrets:
  # Apenas template auxiliar para External Secrets Operator, se você usa ESO.
  enabled: false
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  targetName: ""
  data: []
  # - secretKey: DATABASE_URL
  #   remoteRef:
  #     key: prod/app/database-url

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

rbac:
  create: false
  rules: []
  # - apiGroups: [""]
  #   resources: ["pods"]
  #   verbs: ["get", "list", "watch"]

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  sessionAffinity: ""          # None | ClientIP
  externalTrafficPolicy: ""    # Cluster | Local (NodePort/LoadBalancer)
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

headlessService:
  enabled: false
  annotations: {}

probes:
  liveness:
    enabled: true
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    enabled: false
    httpGet:
      path: /health/startup
      port: http
    failureThreshold: 30
    periodSeconds: 5

# hooks postStart/preStop do container (ex.: preStop com sleep para drenar conexões)
lifecycle: {}
# preStop:
#   exec:
#     command: ["sh", "-c", "sleep 10"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: null
  # métricas extras (Pods/Object/External/ContainerResource) no formato autoscaling/v2
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null
  # IfHealthyBudget | AlwaysAllow (vazio = default do cluster)
  unhealthyPodEvictionPolicy: ""

# lista de Ingresses; vazia = nenhum. Sem `name`: o primeiro usa o fullname, os demais fullname-<índice>.
ingress: []
# - name: public
#   className: nginx
#   annotations: {}
#   hosts:
#     - host: app.example.com
#       paths:
#         - path: /
#           pathType: Prefix      # default: Prefix
#           servicePort: http     # default: http (nome ou número)
#   tls:
#     - secretName: app-tls
#       hosts: [app.example.com]

persistence:
  enabled: false
  accessModes: ["ReadWriteOnce"]
  size: 1Gi
  storageClassName: ""
  annotations: {}
  mountPath: /data
  existingClaim: ""

extraVolumes: []
extraVolumeMounts: []

initContainers: []
sidecars: []

nodeSelector: {}
tolerations: []
affinity: {}
# gera podAntiAffinity entre pods do workload quando `affinity` está vazio: soft | hard | "" (desligado)
antiAffinityPreset: ""
antiAffinityTopologyKey: kubernetes.io/hostname
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
schedulerName: ""
hostAliases: []
dnsConfig: {}
dnsPolicy: ""

networkPolicy:
  enabled: false
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

job:
  enabled: false
  annotations: {}
  labels: {}
  backoffLimit: 3
  activeDeadlineSeconds: null
  ttlSecondsAfterFinished: 86400
  restartPolicy: Never
  # Job é imutável: sem hook, `helm upgrade` com imagem nova falha enquanto o Job antigo existir.
  # Com hook o Job é recriado a cada release. Atenção: em pre-install o ServiceAccount, o configMap e o
  # secret do próprio release ainda não existem; use serviceAccount.create=false (ou events post-*).
  hook:
    enabled: false
    events: pre-install,pre-upgrade
    weight: 0
    deletePolicy: before-hook-creation
  completions: 1
  parallelism: 1
  command: []
  args: []
  env: []
  envFrom: []
  resources: {}

cronjob:
  enabled: false
  schedule: "*/5 * * * *"
  annotations: {}
  labels: {}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: null
  suspend: false
  backoffLimit: 3
  ttlSecondsAfterFinished: null
  activeDeadlineSeconds: null
  restartPolicy: Never
  command: []
  args: []
  env: []
  envFrom: []
  resources: {}

serviceMonitor:
  enabled: false
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  honorLabels: false
  scheme: ""
  tlsConfig: {}
  relabelings: []
  metricRelabelings: []
  # ns onde o ServiceMonitor é criado (default: o do release); namespaceSelector default: ns do release
  namespace: ""
  namespaceSelector: {}

# scrape direto nos pods (workers sem Service); port = nome da porta do container
podMonitor:
  enabled: false
  labels: {}
  annotations: {}
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  honorLabels: false
  relabelings: []
  metricRelabelings: []

prometheusRule:
  enabled: false
  labels: {}
  annotations: {}
  namespace: ""
  groups: []
  # - name: app
  #   rules:
  #     - alert: HighErrorRate
  #       expr: rate(http_requests_total{code=~"5.."}[5m]) > 1
  #       for: 10m

# Gateway API (alternativa ao Ingress); exige os CRDs gateway.networking.k8s.io
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # - name: shared-gateway
  #   namespace: gateways
  hostnames: []
  rules:
    - path: /
      pathType: PathPrefix
      # servicePort: 80   # número; default = primeira porta de service.ports
      # filters: []

# NodePool do Karpenter (v1beta1) dedicado a este release; os pods são amarrados a ele por nodeSelector
karpenter:
  enabled: false
  nodeClassRef: default
  limits:
    cpu: 1000
    memory: 1000Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
    expireAfter: 720h
  requirements: []
  # - key: karpenter.sh/capacity-type
  #   operator: In
  #   values: ["on-demand"]
  taints: []
  metadata: {}

extraObjects: []
