workload:
  type: none
service:
  enabled: false
serviceAccount:
  create: false   # com hook pre-install o ServiceAccount do release ainda não existiria
job:
  enabled: true
  hook:
    enabled: true
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  command: ["/bin/sh", "-c"]
  args: ["./migrate.sh"]
image:
  repository: ghcr.io/acme/db-migrations
  tag: "2026.05.22"
# rootfs é somente leitura por padrão
extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
