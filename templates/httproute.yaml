{{- /* Gateway API, alternativa ao Ingress. Requer os CRDs gateway.networking.k8s.io instalados. */ -}}
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "universal.fullname" . }}
  namespace: {{ include "universal.namespace" . }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
  {{- with include "universal.annotations" (dict "root" $ "extra" .Values.httpRoute.annotations) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  parentRefs:
    {{- if not .Values.httpRoute.parentRefs }}{{ fail "httpRoute.parentRefs é obrigatório" }}{{ end }}
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | default "/" }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "universal.fullname" $ }}
          port: {{ .servicePort | default (first $.Values.service.ports).port }}
    {{- end }}
{{- end }}
