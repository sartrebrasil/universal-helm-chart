image:
  repository: ghcr.io/acme/my-spring-api
  tag: "1.0.0"
containerPorts:
  - name: http
    containerPort: 8080
service:
  ports:
    - name: http
      port: 80
      targetPort: http
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: JAVA_OPTS
    value: "-XX:MaxRAMPercentage=75 -XX:+UseContainerSupport"
probes:
  liveness:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: http
  readiness:
    enabled: true
    httpGet:
      path: /actuator/health/readiness
      port: http
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: http
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
