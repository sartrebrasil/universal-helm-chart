{{- if eq .Values.workload.type "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "universal.fullname" . }}
  namespace: {{ include "universal.namespace" . }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
  {{- with include "universal.annotations" (dict "root" $ "extra" nil) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.workload.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "universal.selectorLabels" (dict "root" $ "component" "workload") | nindent 6 }}
  strategy:
    {{- toYaml .Values.workload.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "universal.selectorLabels" (dict "root" $ "component" "workload") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with include "universal.podAnnotations" (dict "root" $ "checksums" true) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      {{- include "universal.podSpec" (dict "root" $ "component" "workload") | nindent 6 }}
{{- end }}
