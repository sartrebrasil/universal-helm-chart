{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "universal.fullname" . }}
  namespace: {{ default (include "universal.namespace" .) .Values.prometheusRule.namespace }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with include "universal.annotations" (dict "root" $ "extra" .Values.prometheusRule.annotations) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  groups:
    {{- toYaml .Values.prometheusRule.groups | nindent 4 }}
{{- end }}
